<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f4f1">
<title>視展 — 05</title>
<style>html,body{margin:0;min-height:100%;max-width:100%;overflow-x:hidden;overscroll-behavior-x:none;background:#f4f4f1}body{visibility:hidden}</style>
</head>
<body>
<script>
(async()=>{
  const accent='#9b7cff',rgba42='rgba(155,124,255,.42)',rgba32='rgba(155,124,255,.32)',current=5,about='https://kanatama0416-glitch.github.io/about-shiten/';
  const pages=['https://kanatama0416-glitch.github.io/person1-shiten/','https://kanatama0416-glitch.github.io/person2-shiten/','https://kanatama0416-glitch.github.io/person3-shiten/','https://kanatama0416-glitch.github.io/person4-shiten/','https://kanatama0416-glitch.github.io/person5-shiten/'];
  try{
    let html=await(await fetch('https://raw.githubusercontent.com/kanatama0416-glitch/person1-shiten/93246663e808f739feba769129b4593087c794cf/index.html',{cache:'no-store'})).text();
    html=html.replace('<style>','<style>html,body{max-width:100%;overflow-x:hidden!important;overscroll-behavior-x:none}.about-shiten-link{position:relative;z-index:20;display:inline-flex;align-items:center;gap:9px;margin:14px 0 0 14px;padding:8px 11px 8px 9px;background:#111;color:#fff!important;text-decoration:none!important;border:2px solid #111;box-shadow:3px 3px 0 '+accent+';font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.about-shiten-link i{display:block;width:27px;height:16px;border:2px solid #fff;border-radius:50%;position:relative}.about-shiten-link i:after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:'+accent+';left:8px;top:2.5px}.about-shiten-link strong{display:block;font-size:12px;line-height:1.05;letter-spacing:.02em}.about-shiten-link small{display:block;margin-top:3px;font:700 7px/1 Arial,sans-serif;letter-spacing:.14em;opacity:.72}.about-shiten-link:active{transform:translate(2px,2px);box-shadow:1px 1px 0 '+accent+'}');
    const aboutLink='<a class="about-shiten-link" href="'+about+'" aria-label="視展についてへ戻る"><i aria-hidden="true"></i><span><strong>← 視展について</strong><small>ABOUT SHITEN</small></span></a>';
    html=html.replace(/<body([^>]*)>/i,(m,attrs)=>'<body'+attrs+'>'+aboutLink);
    html=html.replaceAll('#ff4f8755',accent+'55').replaceAll('#ff4f87',accent).replaceAll('rgba(255,79,135,.42)',rgba42).replaceAll('rgba(255,79,135,.32)',rgba32);
    let navIndex=0;
    html=html.replace(/<a class="v" href="[^"]*"(?: aria-current="page")?>/g,()=>{const i=navIndex++,url=pages[i];return `<a class="v" href="${url}" onclick="window.location.assign('${url}');return false;"${i===current-1?' aria-current="page"':''}>`});
    if(navIndex!==5)throw new Error('navigation build failed');
    html=html.replace('</style>',`.v:nth-child(1){--eye-color:#ff4f87!important}.v:nth-child(2){--eye-color:#58c8ff!important}.v:nth-child(3){--eye-color:#ffd83d!important}.v:nth-child(4){--eye-color:#70dc8b!important}.v:nth-child(5){--eye-color:#9b7cff!important}.v:first-child b{color:#111!important}.v:nth-child(${current}) b{color:${accent}!important}.v:first-child:before{display:none!important}.v:nth-child(${current}):before{content:"NOW";position:absolute;z-index:6;top:-7px;right:-2px;background:#111;color:#fff;border-radius:99px;padding:1px 5px;font:900 7px Arial;letter-spacing:.08em;display:block!important}
.final-finale{position:fixed;inset:0;z-index:20000;background:#000;overflow:hidden;color:#fff;opacity:0;pointer-events:none;transition:opacity .16s ease}.final-finale.on{opacity:1;pointer-events:all}.final-finale .intro-eye-wrap{z-index:3}.final-finale .intro-title{min-width:6.5em;text-align:center}.final-finale .intro-subtitle{transition:opacity .35s ease}.final-finale .intro-iris{transition:background-color .18s linear}.final-finale.is-fast .intro-eye-wrap{animation:finaleShake .13s steps(2,end) infinite}.finale-static{position:absolute;inset:-20%;z-index:8;opacity:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.13) 0 1px,rgba(0,0,0,0) 1px 4px);mix-blend-mode:screen}.final-finale.is-fast .finale-static{opacity:.18;animation:finaleNoise .1s steps(2,end) infinite}.final-finale.cut .finale-static{opacity:.85;animation:finaleNoise .055s steps(2,end) infinite}.finale-flash{position:absolute;z-index:12;left:50%;top:50%;width:110vw;height:2px;background:#fff;box-shadow:0 0 20px 5px rgba(255,255,255,.8);opacity:0;transform:translate(-50%,-50%) scaleX(1)}.final-finale.cut .finale-flash{animation:finaleFlash .48s ease-out forwards}.final-finale.cut .intro-eye-wrap{animation:finalePowerOff .42s cubic-bezier(.7,0,.9,.25) forwards}.finale-end{position:absolute;inset:0;z-index:20;display:grid;place-items:center;opacity:0;font:300 26px/1 Arial,sans-serif;letter-spacing:.18em;color:rgba(255,255,255,.34);text-transform:lowercase}.finale-end.show{opacity:1;transition:opacity 1.1s ease}.finale-end .q{opacity:0}.finale-end .q.show{opacity:1;transition:opacity .9s ease}.finale-credit{position:absolute;z-index:21;left:0;right:0;bottom:24px;text-align:center;opacity:0;font:400 9px/1.4 Arial,-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;letter-spacing:.11em;color:rgba(255,255,255,.3)}.finale-credit.show{opacity:1;transition:opacity 1.2s ease}@keyframes finaleShake{0%{transform:translate(0,0)}25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(1px,2px)}100%{transform:translate(-1px,-1px)}}@keyframes finaleNoise{0%{transform:translateY(-8px)}50%{transform:translate(5px,7px)}100%{transform:translate(-4px,-3px)}}@keyframes finalePowerOff{0%{opacity:1;transform:scale(1);filter:brightness(1)}72%{opacity:1;transform:scale(1.18,.035);filter:brightness(6)}100%{opacity:0;transform:scale(.18,.012);filter:brightness(10)}}@keyframes finaleFlash{0%{opacity:0;transform:translate(-50%,-50%) scaleX(1)}22%{opacity:1}70%{opacity:.8;transform:translate(-50%,-50%) scaleX(.26)}100%{opacity:0;transform:translate(-50%,-50%) scaleX(0)}}
</style>`);
    const finaleScript='<script>(function(){var old=document.getElementById("secretToggle");if(!old)return;var btn=old.cloneNode(true);old.replaceWith(btn);var played=false;btn.setAttribute("aria-label","05 final ending");btn.setAttribute("aria-pressed","false");btn.addEventListener("click",function(){if(played)return;played=true;btn.disabled=true;document.body.classList.remove("secret-mode");document.body.style.overflow="hidden";var f=document.createElement("div");f.className="final-finale";f.setAttribute("aria-hidden","true");f.innerHTML="<div class=\\"intro-eye-wrap\\"><div class=\\"intro-rays\\"><i></i><i></i><i></i></div><div class=\\"intro-eye\\"><div class=\\"intro-iris\\"></div></div><div class=\\"intro-brand\\"><span class=\\"intro-title\\">視展</span><span class=\\"intro-subtitle\\">SHITEN</span></div></div><div class=\\"finale-static\\"></div><div class=\\"finale-flash\\"></div><div class=\\"finale-end\\"><span>end<span class=\\"q\\">?</span></span></div><div class=\\"finale-credit\\">Created by かなち</div>";document.body.appendChild(f);requestAnimationFrame(function(){f.classList.add("on")});var word=f.querySelector(".intro-title"),sub=f.querySelector(".intro-subtitle"),iris=f.querySelector(".intro-iris"),ending=f.querySelector(".finale-end"),q=f.querySelector(".q"),credit=f.querySelector(".finale-credit");var words=["視点","支点","地天","時点","shiten","視展","視点","支点","地天","時点","shiten"];var colors=["#ff4f87","#58c8ff","#ffd83d","#70dc8b","#9b7cff"];var wi=0,ci=0;function setNext(){word.textContent=words[wi%words.length];iris.style.backgroundColor=colors[ci%colors.length];wi++;ci++}function readable(){sub.style.opacity="0";setNext();if(wi<words.length){setTimeout(readable,650)}else{setTimeout(fast,350)}}var fastN=0;function fast(){f.classList.add("is-fast");setNext();fastN++;if(fastN<26){setTimeout(fast,Math.max(52,190-fastN*5.4))}else{cut()}}function cut(){f.classList.remove("is-fast");f.classList.add("cut");setTimeout(function(){var w=f.querySelector(".intro-eye-wrap");if(w)w.style.display="none";var s=f.querySelector(".finale-static");if(s)s.style.display="none"},520);setTimeout(function(){ending.classList.add("show")},1550);setTimeout(function(){q.classList.add("show")},3500);setTimeout(function(){credit.classList.add("show")},5200)}setTimeout(readable,2300)});})();<\/script>';
    html=html.replace('</body>',finaleScript+'</body>');
    document.open();document.write(html);document.close();
  }catch(e){
    document.body.style.visibility='visible';
    document.body.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;font-family:system-ui">ページを読み込めませんでした。</div>';
  }
})();
</script>
