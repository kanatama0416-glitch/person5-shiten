<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f4f1">
<title>視展 — 05</title>
<style>html,body{margin:0;min-height:100%;background:#f4f4f1}</style>
</head>
<body>
<script>
(async()=>{
  try{
    let source=await(await fetch('https://raw.githubusercontent.com/kanatama0416-glitch/person5-shiten/d54b52445ac79a119370b47f65504d964c9de34e/index.html',{cache:'no-store'})).text();
    const marker='document.open();document.write(html);document.close();';
    if(!source.includes(marker))throw new Error('patch marker not found');
    source=source.replace(marker,`html=html.replace('id="secretToggle"','id="secretToggle" onpointerdown="window.scrollTo(0,0)"').replace('id="tearToggle"','id="tearToggle" onpointerdown="window.scrollTo(0,0)"');${marker}`);
    document.open();document.write(source);document.close();
  }catch(e){
    document.body.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;font-family:system-ui">ページを読み込めませんでした。</div>';
  }
})();
</script>
</body>
</html>
