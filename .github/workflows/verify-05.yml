name: Verify 05 published finale

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-05.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for latest Pages content
        shell: bash
        run: |
          for i in {1..24}; do
            body="$(curl -fsSL "https://kanatama0416-glitch.github.io/person5-shiten/?v=${GITHUB_SHA}" || true)"
            if grep -q "20260919-motion-fix" <<<"$body"; then
              echo "Latest 05 index is published."
              exit 0
            fi
            sleep 5
          done
          echo "Latest 05 index did not appear on Pages."
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser test dependency
        run: python -m pip install --disable-pip-version-check selenium==4.35.0

      - name: Click 05 eye and verify finale animation
        env:
          PAGE_URL: https://kanatama0416-glitch.github.io/person5-shiten/?v=${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait

          url = os.environ["PAGE_URL"]
          options = Options()
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          options.add_argument("--window-size=390,844")

          driver = webdriver.Chrome(options=options)
          wait = WebDriverWait(driver, 20)
          try:
              driver.get(url)
              wait.until(lambda d: d.execute_script(
                  "return !document.body.classList.contains('intro-lock') && !!document.getElementById('secretToggle')"
              ))
              driver.execute_script("document.getElementById('secretToggle').click()")
              wait.until(lambda d: d.execute_script(
                  "return !!document.querySelector('.final-finale.on')"
              ))
              animation = driver.execute_script(
                  "return getComputedStyle(document.querySelector('.final-finale .intro-eye-wrap')).animationName"
              )
              assert "finaleRise" in animation, f"entrance animation missing: {animation}"
              time.sleep(1.25)
              word = driver.execute_script(
                  "return document.querySelector('.final-finale .intro-title').textContent"
              )
              iris = driver.execute_script(
                  "return getComputedStyle(document.querySelector('.final-finale .intro-iris')).backgroundColor"
              )
              assert word in ["視展","視点","支点","支店","私展","時点","至点","SHITEN","始点"], word
              assert iris != "rgb(155, 124, 255)", f"iris did not change: {iris}"
              print("normal motion OK:", animation, word, iris)

              driver.execute_cdp_cmd("Emulation.setEmulatedMedia", {
                  "features": [{"name": "prefers-reduced-motion", "value": "reduce"}]
              })
              driver.get(url + "&reduced=1")
              wait.until(lambda d: d.execute_script(
                  "return !document.body.classList.contains('intro-lock') && !!document.getElementById('secretToggle')"
              ))
              driver.execute_script("document.getElementById('secretToggle').click()")
              wait.until(lambda d: d.execute_script(
                  "return !!document.querySelector('.final-finale.on')"
              ))
              time.sleep(1.25)
              visibility = driver.execute_script(
                  "return getComputedStyle(document.querySelector('.final-finale .intro-title')).visibility"
              )
              reduced_word = driver.execute_script(
                  "return document.querySelector('.final-finale .intro-title').textContent"
              )
              assert visibility != "hidden", f"title hidden under reduced motion: {visibility}"
              assert reduced_word, "title did not update under reduced motion"
              print("reduced motion OK:", visibility, reduced_word)
          finally:
              driver.quit()
          PY
